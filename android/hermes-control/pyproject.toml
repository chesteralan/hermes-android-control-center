[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-control"
version = "0.1.0"
description = "Loopback-only control service for Hermes Agent in Termux"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4"]

[project.scripts]
hermes-control = "hermes_control.server:main"

[tool.setuptools.packages.find]
where = ["src"]
