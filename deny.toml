[advisories]
version = 2
ignore = [
  # RUSTSEC-2024-0370: proc-macro-error is unmaintained (not vulnerable).
  # Transitive build-time dependency of glib-macros 0.18 (Tauri's GTK3 stack);
  # no upgraded release exists on the compatible line. Reviewed 2026-10-12.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained transitive proc-macro dep of the Tauri/GTK3 stack with no compatible upgrade; build-time only, no known vulnerability" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"