[advisories]
version = 2
ignore = [
  # RUSTSEC-2024-0370: proc-macro-error is unmaintained (not vulnerable).
  # Transitive build-time dependency of glib-macros 0.18 (Tauri's GTK3 stack);
  # no upgraded release exists on the compatible line. Reviewed 2026-10-12.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained transitive proc-macro dep of the Tauri/GTK3 stack with no compatible upgrade; build-time only, no known vulnerability" },
  # RUSTSEC-2024-0429: glib VariantStrIter Iterator/DoubleEndedIterator
  # unsoundness (INFO/unsound, not a vulnerability). Linux-only — macOS and
  # Windows do not link glib — runtime-triggered in g_variant string iteration,
  # and no code in this repository calls glib Variant APIs. glib 0.18.5 is the
  # latest release compatible with gtk ^0.18, which every Tauri release still
  # requires (2.12.5 stable and 3.0.0-alpha.5); the fix shipped only in glib
  # >=0.20.0 and the gtk-rs 0.18 branches are frozen. Tauri's coordinated gtk
  # 0.19/glib 0.22 migration is in draft PRs (tauri #16170, wry #1843,
  # tao #1332, webkit2gtk-rs #167, muda #403, tray-icon #369,
  # libappindicator-rs #53; commitment stated in tauri #16264). Remove this
  # ignore when Tauri ships gtk >= 0.19. Note: cargo-deny does not report
  # INFO/unsound-class advisories, so this entry renders as a benign
  # "advisory-not-detected" note — it is the policy record for the advisory
  # that cargo audit (local and the CI audit step) still reports by design.
  # Reviewed 2026-10-27; see docs/SECURITY.md §6.
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18 VariantStrIter unsoundness is Linux-only, runtime-triggered, and unreachable from this codebase; 0.18.5 is the latest release compatible with Tauri's pinned gtk ^0.18 stack while the upstream gtk 0.19 migration lands" },
  # RUSTSEC-2026-0367/0368/0369: zip extract() symlink/permission/suid issues.
  # Our direct zip dep is 9.1.2 (fixed 2026-10-26); this copy is zip 4.6.1,
  # pinned by tauri-plugin-updater 2.13.1 (zip ^4) — no ^4 release is patched
  # and every published plugin version (incl. 2.14.0 and 3.0.0-alpha) still
  # requires ^4. Reviewed 2026-10-26; see docs/SECURITY.md §6.
  { id = "RUSTSEC-2026-0367", reason = "transitive zip 4.6.1 via tauri-plugin-updater (zip ^4, no patched release on that line); updater extracts only signature-verified release archives" },
  { id = "RUSTSEC-2026-0368", reason = "transitive zip 4.6.1 via tauri-plugin-updater (zip ^4, no patched release on that line); updater extracts only signature-verified release archives" },
  { id = "RUSTSEC-2026-0369", reason = "transitive zip 4.6.1 via tauri-plugin-updater (zip ^4, no patched release on that line); updater extracts only signature-verified release archives" },
  # RUSTSEC-2026-0370/0371/0372: zbus_names/zvariant/zvariant_derive unmaintained
  # (merged into zbus 6.0.0 upstream). Transitive via notify-rust in the pinned
  # tauri-plugin-notification 2.4.0; no compatible upgrade exists. Not vulnerable.
  # Reviewed 2026-10-26; see docs/SECURITY.md §6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (merged into zbus 6.0.0); transitive via pinned tauri-plugin-notification, no compatible upgrade, not vulnerable" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (merged into zbus 6.0.0); transitive via pinned tauri-plugin-notification, no compatible upgrade, not vulnerable" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (macros moved into zbus 6.0.0); transitive via pinned tauri-plugin-notification, no compatible upgrade, not vulnerable" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"