[package]
name = "hermes-control-center"
version = "0.1.0"
description = "Desktop control center for Hermes Agent on Android (Termux) over Wireless ADB"
edition = "2021"
rust-version = "1.89"

[lib]
name = "hacc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1.92"
qrcode = "0.14.1"
rand = "0.9.5"
russh = "0.63.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "=2.2.2"
tauri-plugin-store = "2.4.5"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["process", "time", "sync", "macros", "rt-multi-thread", "io-util"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt-multi-thread"] }
